name: Validate & Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with nested app submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run idrive7-cluster-metrics test suite
        working-directory: idrive7-cluster-metrics
        run: |
          npm ci --no-audit --no-fund
          python3 vendor/cauliflowermossgrape-idrive7-apps/kit/tools/build.py --stub-sdk cluster_metrics
          node test/run_tests.js
          rm -rf dist oap-sdk

      - name: Run idrive7-hybrid-capture test suite
        working-directory: idrive7-hybrid-capture
        run: |
          python3 vendor/cauliflowermossgrape-idrive7-apps/kit/tools/build.py --stub-sdk hybrid_capture
          node test/run_tests.js
          rm -rf dist oap-sdk

      - name: Fetch idrive-apps tags & verify upstream PR version rules
        if: hashFiles('idrive-apps/release/release.js') != ''
        run: |
          git -C idrive-apps fetch --unshallow --tags 2>/dev/null || git -C idrive-apps fetch --tags
          node idrive-apps/release/release.js versions waze-on-cluster@0.13.0

      - name: Build & verify MGU Store catalog (no bundled oap-sdk)
        run: node release/build_catalog.js
