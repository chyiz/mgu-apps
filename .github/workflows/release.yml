name: Publish MGU Store Release

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with nested app submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine release channel & tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "mode=develop" >> "$GITHUB_OUTPUT"
            echo "tag=catalog-develop" >> "$GITHUB_OUTPUT"
            echo "base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/catalog-develop" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch idrive-apps history & run waze-on-cluster CI checks
        if: hashFiles('idrive-apps/release/release.js') != ''
        run: |
          git -C idrive-apps fetch --unshallow --tags 2>/dev/null || git -C idrive-apps fetch --tags
          node idrive-apps/release/release.js versions waze-on-cluster@0.13.0
          make -C idrive-apps/native/waze-on-cluster test
          make -C idrive-apps/native/waze-on-cluster test-x86
          node idrive-apps/apps/robertn_waze_cluster/tools/test_control.js
          node idrive-apps/apps/robertn_waze_cluster/tools/test_page.js
          node idrive-apps/apps/robertn_waze_cluster/tools/test_profiles.js
          node idrive-apps/apps/robertn_waze_cluster/tools/test_i18n.js

      - name: Build MGU Store packages & Schema 2 catalog
        run: |
          node release/build_catalog.js --base-url "${{ steps.meta.outputs.base_url }}"

      - name: Upload versioned GitHub Release assets (stable)
        if: steps.meta.outputs.mode == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz dist/*.png dist/mgu-store.json --clobber
          else
            gh release create "$TAG" dist/*.tgz dist/*.png dist/mgu-store.json \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Update rolling `catalog` release for MGU Store (stable)
        if: steps.meta.outputs.mode == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view catalog >/dev/null 2>&1; then
            gh release upload catalog dist/catalog.json dist/*.png --clobber
          else
            gh release create catalog dist/catalog.json dist/*.png \
              --title "MGU Store Catalog" \
              --notes "Automated MGU Store Schema 2 catalog index."
          fi

      - name: Update rolling `catalog-develop` prerelease for MGU Store (develop)
        if: steps.meta.outputs.mode == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view catalog-develop >/dev/null 2>&1; then
            gh release upload catalog-develop dist/catalog.json dist/*.tgz dist/*.png dist/mgu-store.json --clobber
          else
            gh release create catalog-develop dist/catalog.json dist/*.tgz dist/*.png dist/mgu-store.json \
              --prerelease \
              --title "MGU Store Catalog (Develop)" \
              --notes "Rolling develop test channel for MGU Store (subscribe via HTTPS catalog URL)."
          fi

      - name: Mirror `catalog.json` + icons to `catalog-develop` branch (raw.githubusercontent.com HMI source)
        if: steps.meta.outputs.mode == 'develop'
        run: |
          TMP_DIR=$(mktemp -d)
          cp dist/catalog.json dist/*.png "$TMP_DIR/"
          cd "$TMP_DIR"
          git init -b catalog-develop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: publish develop catalog (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" catalog-develop:refs/heads/catalog-develop
